# /etc/nginx/sites-available/cafemaad: Cafe Maad on a server that also hosts other sites.
# ArvanCloud terminates HTTPS and talks to this origin over plain HTTP on port 80.
# The site is a single self-contained index.html (hash routes: /#/order, /#/blog/01, ...),
# so only "/", the app icons and the web manifest are served; the rest of the repository stays private.

server {
    listen 80;
    listen [::]:80;
    server_name cafemaad.ir www.cafemaad.ir;

    root /var/www/cafemaad;
    charset utf-8;

    # Fonts and images are embedded, so the page is ~3 MB before compression.
    gzip on;
    gzip_comp_level 6;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Revalidate on every visit so a redeploy shows up at once (ETag keeps it cheap).
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location = /index.html {
        return 301 /;
    }

    # Favicon, home-screen icons and manifest (logo changes are rare; a week of caching is fine).
    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location = /favicon.ico {
        return 301 /icons/favicon-32.png;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location / {
        return 404;
    }
}
